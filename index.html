<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5c400">
  <title>TOMORO Event POS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font:16px Arial,sans-serif;background:#f5f5f5;color:#222}
    header{background:#f5c400;padding:14px 18px;font-weight:800;display:flex;justify-content:space-between}
    main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
    section{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}
    h2{margin:0 0 12px;font-size:20px}
    .menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    button{cursor:pointer;border:0;border-radius:9px;padding:12px;font-weight:700}
    .item{background:#fff8d6;border:1px solid #ead36a;text-align:left}
    .item small{display:block;margin-top:6px;font-weight:400}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
    .qty button{padding:5px 10px;background:#eee}
    .total{font-size:22px;font-weight:800;margin:16px 0}
    select,input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px}
    .pay{background:#222;color:white;width:100%;font-size:17px}
    .clear{background:#eee}
    #notice{margin-top:12px;font-size:14px}
    @media(max-width:700px){main{grid-template-columns:1fr}.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<header><span>TOMORO EVENT POS</span><span id="status">Kasir Offline</span></header>
<main>
  <section>
    <h2>Menu</h2>
    <div class="menu" id="menu"></div>
  </section>
  <section>
    <h2>Keranjang</h2>
    <div id="cart"><p>Belum ada item.</p></div>
    <div class="total">Total: <span id="total">Rp0</span></div>
    <label>Metode pembayaran</label>
    <select id="payment"><option>QRIS</option><option>CASH</option></select>
    <label>Uang diterima (khusus CASH)</label>
    <input id="cash" type="number" inputmode="numeric" placeholder="Nominal uang">
    <button class="pay" onclick="checkout()">Simpan Transaksi</button>
    <button class="clear" onclick="clearCart()" style="width:100%;margin-top:8px">Kosongkan Keranjang</button>
    <div id="notice"></div>
  </section>
</main>
<script>
const products=[
 ["P001","Tomoro Aren Latte",25000],
 ["P002","Americano",22000],
 ["P003","Caffe Latte",28000],
 ["P004","Cappuccino",28000],
 ["P005","Peach Americano",23000],
 ["P006","Chocolate",28000],
 ["P007","Matcha Latte",30000]
];
const KEY="tomoro_event_pos_offline_v1";
let cart={};
const rupiah=n=>"Rp"+Number(n).toLocaleString("id-ID");
function renderMenu(){
 document.getElementById("menu").innerHTML=products.map(p=>
 `<button class="item" onclick="add('${p[0]}')">${p[1]}<small>${rupiah(p[2])}</small></button>`
 ).join("");
}
function add(id){cart[id]=(cart[id]||0)+1;renderCart();}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart();}
function getTotal(){return products.reduce((s,p)=>s+p[2]*(cart[p[0]]||0),0);}
function renderCart(){
 const rows=products.filter(p=>cart[p[0]]).map(p=>
 `<div class="row"><div>${p[1]}<br><small>${rupiah(p[2])} × ${cart[p[0]]}</small></div>
 <div class="qty"><button onclick="change('${p[0]}',-1)">−</button>
 <button onclick="change('${p[0]}',1)">+</button></div></div>`
 ).join("");
 document.getElementById("cart").innerHTML=rows||"<p>Belum ada item.</p>";
 document.getElementById("total").textContent=rupiah(getTotal());
}
function clearCart(){cart={};renderCart();document.getElementById("notice").textContent="Keranjang dikosongkan.";}
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEKfl9XlMUho2oNDRnFSQUEd-ra81WQsXpXfJ76C_AhSKAllWKx0BQ12wNpVCeed2cNg/exec";

let syncRunning = false;

function syncPendingTransactions() {
  if (!navigator.onLine || syncRunning) return;

  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  const pending = saved.find(tx => !tx.synced);

  if (!pending) return;

  syncRunning = true;

  const payload = {
    transactionId: pending.id,
    paymentMethod: pending.payment,
    items: pending.items.map(item => ({
      id: item.id,
      qty: item.qty
    })),
    cashReceived: pending.cash,
    cashier: "KASIR"
  };

  const callbackName = "tomoroSyncCallback";

  window[callbackName] = function(result) {
    delete window[callbackName];
    script.remove();
    syncRunning = false;

    if (result && result.success === true) {
      const latest = JSON.parse(localStorage.getItem(KEY) || "[]");
      const transaction = latest.find(tx => tx.id === pending.id);

      if (transaction) {
        transaction.synced = true;
        localStorage.setItem(KEY, JSON.stringify(latest));
      }

      document.getElementById("notice").textContent =
        "Transaksi berhasil disinkronkan ke Spreadsheet.";

      syncPendingTransactions();
    } else {
      document.getElementById("notice").textContent =
        "Sinkronisasi gagal. Transaksi tetap tersimpan di perangkat.";
    }
  };

  const script = document.createElement("script");
  const params = new URLSearchParams({
    action: "sync",
    callback: callbackName,
    payload: JSON.stringify(payload)
  });

  script.src = APPS_SCRIPT_URL + "?" + params.toString();

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
    syncRunning = false;

    document.getElementById("notice").textContent =
      "Gagal terhubung ke Spreadsheet. Transaksi tetap tersimpan di perangkat.";
  };

  document.body.appendChild(script);
}

window.addEventListener("online", syncPendingTransactions);
function checkout() {
  if (!Object.keys(cart).length) {
    alert("Pilih menu terlebih dahulu.");
    return;
  }

  const payment = document.getElementById("payment").value;
  const total = getTotal();
  const cash = payment === "CASH"
    ? Number(document.getElementById("cash").value || 0)
    : total;

  if (payment === "CASH" && cash < total) {
    alert("Uang diterima kurang dari total.");
    return;
  }

  const tx = {
    id: "OFF-" + Date.now() + "-" +
      Math.random().toString(36).slice(2, 8),
    time: new Date().toISOString(),
    payment: payment,
    items: products
      .filter(p => cart[p[0]])
      .map(p => ({
        id: p[0],
        name: p[1],
        price: p[2],
        qty: cart[p[0]]
      })),
    total: total,
    cash: cash,
    change: cash - total,
    synced: false
  };

  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  saved.push(tx);
  localStorage.setItem(KEY, JSON.stringify(saved));

  cart = {};
  renderCart();
  document.getElementById("cash").value = "";

  document.getElementById("notice").textContent =
    "Transaksi tersimpan di perangkat. Menyiapkan sinkronisasi...";

  alert("Transaksi tersimpan di perangkat.");

  syncPendingTransactions();
}
renderMenu();renderCart();
document.getElementById("status").textContent=navigator.onLine?"Online":"Offline";
window.addEventListener("online",()=>document.getElementById("status").textContent="Online");
window.addEventListener("offline",()=>document.getElementById("status").textContent="Offline");
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/tomoro-event-pos/sw.js")
      .then(() => console.log("Service Worker aktif"))
      .catch((error) => console.error("Service Worker gagal:", error));
  });
}
</script>
</body>
</html>
